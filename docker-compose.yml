services:
  web:
    image: ${DOCKER_IMAGE:-ghcr.io/riyajul-rony/autohub-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-n8n-scad_cerkitlabs}"
      - "traefik.http.routers.leadreach.rule=Host(`${APP_DOMAIN:?APP_DOMAIN is required}`)"
      - "traefik.http.routers.leadreach.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.leadreach.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.leadreach.loadbalancer.server.port=3000"
    environment: &app_env
      NODE_ENV: production
      SERVICE_ROLE: web
      APP_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}
      DATABASE_URL: postgresql://${POSTGRES_USER:-leadreach}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:-leadreach}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      TZ: UTC
    volumes:
      - appdata:/data
    networks:
      - leadreach_internal
      - traefik_network
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    image: ${DOCKER_IMAGE:-ghcr.io/riyajul-rony/autohub-app:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node_modules/.bin/tsx", "src/server/worker/runner.ts"]
    environment:
      <<: *app_env
      SERVICE_ROLE: worker
    volumes:
      - appdata:/data
    networks:
      - leadreach_internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leadreach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-leadreach}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - leadreach_internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leadreach} -d ${POSTGRES_DB:-leadreach}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - leadreach_internal
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10

volumes:
  appdata:
  pgdata:
  redisdata:

networks:
  leadreach_internal:
    driver: bridge
  traefik_network:
    name: ${TRAEFIK_NETWORK:-n8n-scad_cerkitlabs}
    external: true
